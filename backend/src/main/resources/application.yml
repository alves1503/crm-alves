spring:
  application:
    name: alves-crm-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alvescrm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:alvescrm}
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-hours: ${JWT_TOKEN_HOURS:12}
  admin:
    email: ${CRM_ADMIN_EMAIL}
    password: ${CRM_ADMIN_PASSWORD}
  whatsapp:
    evolution-url: ${EVOLUTION_API_URL:http://localhost:8081}
    evolution-api-key: ${EVOLUTION_API_KEY}
    instance: ${EVOLUTION_INSTANCE:suporte}
    webhook-secret: ${EVOLUTION_WEBHOOK_SECRET}
    closed-message: ${CRM_CLOSED_MESSAGE:Olá! Agradecemos por conversar com a equipe Alves.CRM. Este atendimento foi encerrado, mas continuamos à disposição caso precise de suporte ou tenha novas dúvidas. Será um prazer ajudar você novamente.}
  ai:
    enabled: ${AI_ENABLED:false}
    openai-api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
